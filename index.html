
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171614">
<meta name="description" content="R. Yard – Autorin für Kurzkrimis und Thriller. Geschichten über Geheimnisse und menschliche Abgründe.">
<title>R. Yard | Kurzkrimis & Thriller</title>

<style>
:root {
  --gold: #b58c4b;
  --gold-light: #d1ad70;
  --cream: #e8dfcf;
  --muted: #c5b9a7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  background: #171614;
  font-family: Georgia, "Times New Roman", serif;
}

.scene {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 40px 20px;
  isolation: isolate;

  background-image:
    linear-gradient(
      90deg,
      rgba(10, 9, 8, .18),
      rgba(10, 9, 8, .48) 45%,
      rgba(10, 9, 8, .60)
    ),
    linear-gradient(
      180deg,
      rgba(0, 0, 0, .15),
      transparent 35%,
      rgba(0, 0, 0, .45)
    ),
    url("keller-hintergrund.png");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #171614;
}

/* Zusätzliche dunkle Ränder für mehr räumliche Tiefe */
.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 55% 65% at 50% 48%,
      transparent 15%,
      rgba(0, 0, 0, .35) 100%
    );
}

main {
  position: relative;
  z-index: 1;
  width: min(760px, 100%);
  text-align: center;
  padding: 80px 20px;
}

.eyebrow {
  margin-bottom: 26px;
  color: var(--gold-light);
  font: 500 10px/1.6 Arial, sans-serif;
  letter-spacing: .34em;
  text-transform: uppercase;
  text-shadow: 0 2px 12px rgba(0,0,0,.8);
}

h1 {
  margin: 0;
  color: #eee5d6;
  font-size: clamp(54px, 10vw, 92px);
  font-weight: 400;
  letter-spacing: .13em;
  text-indent: .13em;
  text-shadow: 0 4px 28px rgba(0,0,0,.85);
}

.rule {
  width: 54px;
  height: 1px;
  margin: 30px auto 27px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

h2 {
  margin: 0;
  color: #e2d7c5;
  font-size: clamp(18px, 3vw, 23px);
  font-weight: 400;
  letter-spacing: .12em;
  text-shadow: 0 2px 14px rgba(0,0,0,.8);
}

.intro {
  max-width: 440px;
  margin: 20px auto 0;
  color: var(--muted);
  font: 14px/1.9 Arial, sans-serif;
  letter-spacing: .025em;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
}

.coming-soon {
  display: inline-block;
  margin-top: 39px;
  padding: 13px 24px;
  border: 1px solid rgba(181,140,75,.85);
  border-radius: 2px;
  color: #171614;
  background: linear-gradient(135deg, #c5a36a, #a98143);
  font: 600 10px/1.2 Arial, sans-serif;
  letter-spacing: .19em;
  text-transform: uppercase;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
}

footer {
  position: absolute;
  bottom: 22px;
  left: 20px;
  right: 20px;
  z-index: 2;
  color: rgba(207,195,175,.65);
  text-align: center;
  font: 10px/1.8 Arial, sans-serif;
  letter-spacing: .10em;
}

footer p {
  margin: 4px 0 0;
}

footer a {
  color: rgba(207,195,175,.75);
  text-decoration: none;
  transition: color .2s ease;
}

footer a:hover {
  color: var(--gold-light);
}

@media (max-width: 520px) {
  main {
    padding: 60px 15px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: .25em;
  }

  .scene {
    background-position: 38% center;
  }

  footer {
    bottom: 15px;
  }
}
</style>
</head>

<body>
<div class="scene">

  <main>
    <p class="eyebrow">Autorin für Kurzkrimis & Thriller</p>

    <h1>R. YARD</h1>

    <div class="rule"></div>

    <h2>Kurzkrimis &amp; Thriller</h2>

    <p class="intro">
      Geschichten über Geheimnisse, menschliche Abgründe
      und das, was im Verborgenen liegt.
    </p>

    <span class="coming-soon">
      Weitere Informationen folgen
    </span>
  </main>

  <footer>
    © 2026 R. Yard
    <p>
      <a href="impressum.html">Impressum</a>
      &nbsp;|&nbsp;
      <a href="datenschutz.html">Datenschutz</a>
    </p>
  </footer>

</div>
</body>
</html>
