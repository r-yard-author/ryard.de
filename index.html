
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171614">
<meta name="description" content="R. Yard – Autorin für Kurzkrimis und Thriller. Weitere Informationen folgen.">
<title>R. Yard | Kurzkrimis & Thriller</title>

<style>
:root {
  --dark: #171614;
  --gold: #b58c4b;
  --gold-light: #d1ad70;
  --cream: #e8dfcf;
  --muted: #b9ad9b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  background: #171614;
  font-family: Georgia, "Times New Roman", serif;
}

.scene {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 40px 20px;
  isolation: isolate;
  background:
    radial-gradient(
      ellipse 48% 65% at 12% 18%,
      rgba(119, 78, 39, .30),
      transparent 100%
    ),
    radial-gradient(
      ellipse 38% 52% at 88% 78%,
      rgba(91, 61, 37, .25),
      transparent 100%
    ),
    radial-gradient(
      ellipse 30% 45% at 72% 8%,
      rgba(102, 76, 48, .13),
      transparent 100%
    ),
    linear-gradient(
      125deg,
      #211e1a 0%,
      #171614 42%,
      #201b17 72%,
      #100f0e 100%
    );
}

/* Organische, unregelmäßige Wandstruktur */
.scene::before {
  content: "";
  position: absolute;
  inset: -12%;
  z-index: -2;
  pointer-events: none;
  opacity: .55;
  background:
    radial-gradient(
      ellipse 30% 24% at 18% 28%,
      rgba(185, 137, 77, .12),
      transparent 100%
    ),
    radial-gradient(
      ellipse 24% 38% at 82% 62%,
      rgba(120, 85, 51, .13),
      transparent 100%
    ),
    radial-gradient(
      ellipse 45% 18% at 52% 95%,
      rgba(0, 0, 0, .32),
      transparent 100%
    ),
    repeating-linear-gradient(
      167deg,
      transparent 0 83px,
      rgba(218, 197, 163, .018) 84px,
      transparent 87px
    ),
    repeating-linear-gradient(
      12deg,
      transparent 0 121px,
      rgba(0, 0, 0, .11) 122px,
      transparent 126px
    );
  filter: blur(3px);
}

/* Tiefe Schatten und unregelmäßiger Lichtabfall */
.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 65% 75% at 48% 48%,
      transparent 15%,
      rgba(0, 0, 0, .24) 100%
    ),
    linear-gradient(
      90deg,
      rgba(0, 0, 0, .27),
      transparent 27%,
      transparent 76%,
      rgba(0, 0, 0, .38)
    ),
    linear-gradient(
      180deg,
      rgba(0, 0, 0, .15),
      transparent 35%,
      transparent 75%,
      rgba(0, 0, 0, .35)
    );
}

main {
  position: relative;
  z-index: 1;
  width: min(760px, 100%);
  text-align: center;
  padding: 80px 20px;
}

.eyebrow {
  margin-bottom: 26px;
  color: var(--gold-light);
  font: 500 10px/1.6 Arial, sans-serif;
  letter-spacing: .34em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: #eee5d6;
  font-size: clamp(54px, 10vw, 92px);
  font-weight: 400;
  letter-spacing: .13em;
  text-indent: .13em;
  text-shadow: 0 4px 24px rgba(0,0,0,.65);
}

.rule {
  width: 54px;
  height: 1px;
  margin: 30px auto 27px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

h2 {
  margin: 0;
  color: #e2d7c5;
  font-size: clamp(18px, 3vw, 23px);
  font-weight: 400;
  letter-spacing: .12em;
}

.intro {
  max-width: 440px;
  margin: 20px auto 0;
  color: var(--muted);
  font: 14px/1.9 Arial, sans-serif;
  letter-spacing: .025em;
}

.coming-soon {
  display: inline-block;
  margin-top: 39px;
  padding: 13px 24px;
  border: 1px solid rgba(181,140,75,.78);
  border-radius: 2px;
  color: #171614;
  background: linear-gradient(135deg, #c5a36a, #a98143);
  font: 600 10px/1.2 Arial, sans-serif;
  letter-spacing: .19em;
  text-transform: uppercase;
}

footer {
  position: absolute;
  bottom: 22px;
  left: 20px;
  right: 20px;
  color: rgba(207,195,175,.48);
  text-align: center;
  font: 10px/1.5 Arial, sans-serif;
  letter-spacing: .10em;
}

@media (max-width: 520px) {
  main {
    padding: 60px 15px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: .25em;
  }
}
</style>
</head>

<body>
<div class="scene">

  <main>
    <p class="eyebrow">Autorin für Kurzkrimis & Thriller</p>

    <h1>R. YARD</h1>

    <div class="rule"></div>

    <h2>Kurzkrimis &amp; Thriller</h2>

    <p class="intro">
      Geschichten über Geheimnisse, menschliche Abgründe
      und das, was im Verborgenen liegt.
    </p>

    <span class="coming-soon">
      Weitere Informationen folgen
    </span>
  </main>

  <footer>
    © 2026 R. Yard
    <a href="impressum.html">Impressum</a>
    | <a href="datenschutz.html">Datenschutz</a>
  </footer>

</div>
</body>
</html>
